<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0a0e0f"/>
  
  <!-- Subtle grid lines -->
  <line x1="100" y1="0" x2="100" y2="512" stroke="#1e2a2d" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="512" stroke="#1e2a2d" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="512" stroke="#1e2a2d" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="512" stroke="#1e2a2d" stroke-width="1"/>
  <line x1="0" y1="128" x2="512" y2="128" stroke="#1e2a2d" stroke-width="1"/>
  <line x1="0" y1="256" x2="512" y2="256" stroke="#1e2a2d" stroke-width="1"/>
  <line x1="0" y1="384" x2="512" y2="384" stroke="#1e2a2d" stroke-width="1"/>

  <!-- Rising chart line -->
  <polyline
    points="72,360 152,320 232,290 292,240 352,180 440,120"
    fill="none"
    stroke="#00d4a1"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Area fill under line -->
  <polygon
    points="72,360 152,320 232,290 292,240 352,180 440,120 440,400 72,400"
    fill="url(#chartGrad)"
  />

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4a1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00d4a1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dot at current position (top right of line) -->
  <circle cx="440" cy="120" r="16" fill="#00d4a1"/>
  <circle cx="440" cy="120" r="8" fill="#0a0e0f"/>

  <!-- £ symbol -->
  <text
    x="256"
    y="470"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="52"
    font-weight="bold"
    fill="#ffd166"
    opacity="0.9"
  >NET WORTH</text>
</svg>
