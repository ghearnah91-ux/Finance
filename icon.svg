<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111a1c"/>
      <stop offset="100%" stop-color="#0a0f10"/>
    </linearGradient>
    <linearGradient id="vgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0f1" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#e8f0f1" stop-opacity="0.38"/>
    </linearGradient>
    <radialGradient id="dotgrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#c8922a"/>
    </radialGradient>
    <radialGradient id="ambient" cx="50%" cy="62%" r="38%">
      <stop offset="0%" stop-color="#00d4a1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00d4a1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#ambient)"/>

  <!-- V — larger, arms start higher and wider -->
  <line x1="98" y1="118" x2="256" y2="374"
    stroke="url(#vgrad)" stroke-width="16"
    stroke-linecap="round" clip-path="url(#frame)"/>
  <line x1="414" y1="118" x2="256" y2="374"
    stroke="url(#vgrad)" stroke-width="16"
    stroke-linecap="round" clip-path="url(#frame)"/>

  <!-- Gold dot -->
  <circle cx="256" cy="374" r="9" fill="url(#dotgrad)" clip-path="url(#frame)"/>
</svg>
